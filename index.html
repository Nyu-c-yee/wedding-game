<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>我們的故事解謎之旅</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ① 開場畫面 -->
  <section id="intro-screen" class="card">
    <div class="eyebrow">Wedding Puzzle</div>
    <span class="couple-names">新郎 ＆ 新娘</span>
    <h1 class="title">我們的故事解謎之旅</h1>
    <p class="intro-text" id="intro-text"></p>
    <button id="start-btn" class="btn btn-primary">開始解謎</button>
  </section>

  <!-- ② 遊戲畫面 -->
  <section id="game-screen" class="card" hidden>
    <div class="game-header">
      <div class="seals" id="seals"></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <h2 class="title" id="level-title"></h2>
    <img class="level-image" id="level-image" alt="" hidden />
    <p class="level-prompt" id="level-prompt"></p>

    <input
      type="text"
      id="answer-input"
      placeholder="輸入答案…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    />

    <div class="match-container" id="match-container" hidden></div>

    <div class="circuit-container" id="circuit-container" hidden>
      <div class="circuit-panel" id="circuit-panel"></div>
      <button id="circuit-reset-btn" class="btn btn-ghost circuit-reset" type="button">復原</button>
    </div>

    <button id="submit-btn" class="btn btn-primary">送出答案</button>
    <div class="feedback" id="feedback"></div>

    <div class="hint-row">
      <button id="hint-btn" class="hint-btn">需要提示嗎？</button>
    </div>
  </section>

  <!-- ③ 結局畫面 -->
  <section id="result-screen" class="card" hidden>
    <div class="eyebrow">The End</div>
    <h2 class="title" id="final-title"></h2>
    <p class="final-time" id="final-time"></p>
    <p class="final-message" id="final-message"></p>
    <button id="restart-btn" class="btn btn-ghost">重新遊玩</button>
  </section>

  <!-- ④ 設置頁面 -->
  <section id="setting-screen" class="prase" hidden>
    <div class="menu">設置</div>
    <button id="return-btn" class="language-btn">返回遊戲</button>

    <div class="settings-label">語言</div>
    <div class="lang-options" id="lang-options">
      <button id="lang-zh-btn" class="lang-option" data-lang="zh">中文</button>
      <button id="lang-decode-btn" class="lang-option" data-lang="decode">看懂亂碼</button>
    </div>

    <button id="settings-reset-btn" class="language-btn danger">重設進度</button>
  </section>

  <!-- 右上角齒輪按鈕，三個主畫面都能打開設置 -->
  <button id="settings-toggle-btn" class="settings-toggle" aria-label="設置">⚙</button>

  <!-- ⑤ 2D 對話框：開場故事與提示都會進到這個對話模式 -->
  <div id="dialogue-overlay" class="dialogue-overlay" hidden>
    <div class="dialogue-box">
      <img id="dialogue-avatar" class="dialogue-avatar" src="" alt="" />
      <div class="dialogue-panel">
        <div class="dialogue-name" id="dialogue-name"></div>
        <p class="dialogue-text" id="dialogue-text"></p>
        <button id="dialogue-next-btn" class="dialogue-next" aria-label="繼續">▶</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
